<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="verdictpack — measure the measurer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#14344d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <!-- gauge motif: an arc of ticks with a needle, and a verdict check -->
  <g transform="translate(170,170)">
    <path d="M -110 40 A 118 118 0 0 1 110 40" fill="none" stroke="#33566e" stroke-width="10" stroke-linecap="round"/>
    <g stroke="#7fb3c8" stroke-width="5" stroke-linecap="round">
      <line x1="-104" y1="18" x2="-92" y2="26"/>
      <line x1="-76" y1="-52" x2="-66" y2="-42"/>
      <line x1="-28" y1="-96" x2="-24" y2="-82"/>
      <line x1="28" y1="-96" x2="24" y2="-82"/>
      <line x1="76" y1="-52" x2="66" y2="-42"/>
      <line x1="104" y1="18" x2="92" y2="26"/>
    </g>
    <line x1="0" y1="30" x2="58" y2="-58" stroke="#f2b134" stroke-width="8" stroke-linecap="round"/>
    <circle r="13" cy="30" fill="#f2b134"/>
    <path d="M -34 108 l 22 22 l 46 -50" fill="none" stroke="#57c98a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" transform="translate(6,-6)"/>
  </g>
  <text x="340" y="150" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="bold" fill="#ffffff">verdictpack</text>
  <text x="343" y="205" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#b8d4e4">Measure the measurer.</text>
  <text x="343" y="248" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#7f9db1">Five agent skills for validating graders, scoring agent runs,</text>
  <text x="343" y="278" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#7f9db1">auditing eval coverage, and calibrating judges.</text>
</svg>
